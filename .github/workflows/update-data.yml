name: Refresh TSMC market data & news

on:
  schedule:
    # Every 4 hours — the live news feed and price stats both benefit from
    # a tighter cadence than the old daily-only schedule; the written
    # analysis itself remains static, hand-researched content.
    - cron: "23 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-tsmc-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch TSMC market data
        run: python scripts/fetch_tsmc_data.py

      - name: Fetch news
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: refresh TSMC market data & news [skip ci]"
          git push
